[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strang-linear-algebra"
version = "0.1.0"
description = "Notebook-first Hinglish study project for Gilbert Strang's Introduction to Linear Algebra."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "sympy>=1.12",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
